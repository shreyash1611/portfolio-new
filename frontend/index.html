<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/e30-side.png?v=2" as="image" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Shreyash Chaurasia</title>
    <style>
      /* Shows before any JS — covers the blank gap while the bundle downloads. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0c0c0c;
        color: #888;
        font-family: "Space Grotesk", monospace, sans-serif;
        transition: opacity 0.45s ease;
      }
      #boot-splash.is-out {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        text-align: center;
      }
      #boot-splash .boot-made {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #888;
      }
      #boot-splash .boot-name {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.2rem, 8vw, 4rem);
        font-weight: 400;
        line-height: 1.05;
        color: #f2f2f2;
      }
      #boot-splash .boot-bar {
        width: min(12rem, 42vw);
        height: 2px;
        margin-top: 0.5rem;
        background: #1a1a1a;
        overflow: hidden;
        border-radius: 2px;
      }
      #boot-splash .boot-bar > span {
        display: block;
        height: 100%;
        width: 40%;
        background: #ffa116;
        border-radius: 2px;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true">
      <div class="boot-stage">
        <p class="boot-made">Made by</p>
        <p class="boot-name">Shreyash Chaurasia</p>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
