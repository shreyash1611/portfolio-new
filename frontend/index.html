<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/e30-side.png?v=2" as="image" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Shreyash Chaurasia</title>
    <style>
      /* Shows before any JS — covers the blank gap while the bundle downloads. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0c0c0c;
        color: #888;
        font-family: "Space Grotesk", monospace, sans-serif;
        transition: opacity 0.45s ease;
      }
      #boot-splash.is-out {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        width: min(1100px, 96vw);
      }
      #boot-splash img {
        width: 100%;
        max-height: min(48vh, 420px);
        object-fit: contain;
        filter: drop-shadow(0 18px 36px rgba(255, 161, 22, 0.28));
      }
      #boot-splash .boot-bar {
        width: min(420px, 72%);
        height: 3px;
        background: #1a1a1a;
        overflow: hidden;
        border-radius: 2px;
      }
      #boot-splash .boot-bar > span {
        display: block;
        height: 100%;
        width: 35%;
        background: #ffa116;
        border-radius: 2px;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot-splash p {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true">
      <div class="boot-stage">
        <img src="/e30-side.png?v=2" alt="" width="1473" height="475" />
        <div class="boot-bar"><span></span></div>
        <p>Loading</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
